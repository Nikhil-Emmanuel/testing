<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sprint Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff5e1a;
    --orange-dark:#e04600;
    --bg:#0b0d10;
    --panel:#14171c;
    --line:#2a2f36;
    --text:#eef1f4;
    --muted:#8a9099;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    overflow:hidden;
  }
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(255,94,26,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,94,26,0.06), transparent 40%),
      var(--bg);
  }
  .screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transform:scale(0.97);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
  }

  /* Diagonal sporty stripes */
  .stripes{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    opacity:0.5;
  }
  .stripes::before, .stripes::after{
    content:"";
    position:absolute;
    width:60%;
    height:200%;
    top:-50%;
    background:linear-gradient(180deg, transparent, rgba(255,94,26,0.05), transparent);
    transform:rotate(15deg);
  }
  .stripes::before{ left:-10%; }
  .stripes::after{ right:-25%; }

  /* ---------- START SCREEN ---------- */
  #start-screen h1{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2rem, 6vw, 3.6rem);
    letter-spacing:4px;
    margin:0;
    color:var(--text);
    text-align:center;
    z-index:1;
  }
  #start-screen h1 span{
    color:var(--orange);
  }
  #start-screen p.subtitle{
    color:var(--muted);
    font-size:1.1rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:10px 0 50px 0;
    z-index:1;
  }

  .start-btn{
    z-index:1;
    position:relative;
    width:180px;
    height:180px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ff7a3d, var(--orange) 55%, var(--orange-dark) 100%);
    color:#0b0d10;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:1.6rem;
    letter-spacing:3px;
    box-shadow:
      0 0 0 8px rgba(255,94,26,0.08),
      0 0 0 16px rgba(255,94,26,0.05),
      0 20px 40px rgba(255,94,26,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .start-btn:hover{
    transform:scale(1.04);
    box-shadow:
      0 0 0 10px rgba(255,94,26,0.12),
      0 0 0 20px rgba(255,94,26,0.06),
      0 25px 50px rgba(255,94,26,0.45);
  }
  .start-btn:active{
    transform:scale(0.97);
  }

  .pulse-ring{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    border:2px solid rgba(255,94,26,0.5);
    z-index:0;
    animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:scale(1); opacity:0.8; }
    100%{ transform:scale(1.7); opacity:0; }
  }

  /* ---------- TIMER SCREEN ---------- */
  #timer-screen{
    z-index:1;
  }
  .top-bar{
    position:absolute;
    top:0;left:0;right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 30px;
    z-index:2;
  }
  .top-bar .brand{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    letter-spacing:3px;
    font-size:0.95rem;
    color:var(--muted);
  }
  .top-bar .brand span{ color:var(--orange); }

  .back-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 18px;
    border-radius:30px;
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .back-btn:hover{
    border-color:var(--orange);
    color:var(--orange);
  }

  .clock-wrap{
    text-align:center;
    margin-bottom:30px;
  }
  .clock-label{
    color:var(--muted);
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:0.8rem;
    margin-bottom:6px;
  }
  #live-clock{
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:clamp(1.4rem, 4vw, 2.2rem);
    color:var(--text);
    letter-spacing:2px;
  }

  .panel{
    background:linear-gradient(180deg, var(--panel), #101318);
    border:1px solid var(--line);
    border-radius:24px;
    padding:40px 50px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    max-width:92vw;
  }

  .stopwatch-label{
    color:var(--orange);
    letter-spacing:5px;
    text-transform:uppercase;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:14px;
  }

  #stopwatch{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2.8rem, 9vw, 5rem);
    letter-spacing:2px;
    color:var(--text);
    margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  #stopwatch .ms{
    font-size:0.5em;
    color:var(--muted);
  }

  .controls{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:26px;
  }
  .ctrl-btn{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:0.95rem;
    padding:14px 30px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    transition:transform 0.12s ease, filter 0.12s ease;
  }
  .ctrl-btn:active{ transform:scale(0.95); }

  .btn-primary{
    background:var(--orange);
    color:#0b0d10;
    box-shadow:0 10px 25px rgba(255,94,26,0.35);
  }
  .btn-primary:hover{ filter:brightness(1.1); }

  .btn-secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
  }
  .btn-secondary:hover{ border-color:var(--orange); color:var(--orange); }

  .btn-reset{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
  }
  .btn-reset:hover{ border-color:#ff4d4d; color:#ff4d4d; }

  .lap-section{
    margin-top:30px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .lap-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .lap-title{
    color:var(--muted);
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:0.8rem;
  }
  .lap-count{
    font-family:'Orbitron',sans-serif;
    background:rgba(255,94,26,0.12);
    color:var(--orange);
    border-radius:20px;
    padding:4px 14px;
    font-size:0.9rem;
    font-weight:700;
  }
  #lap-list{
    max-height:130px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-right:4px;
  }
  #lap-list::-webkit-scrollbar{ width:6px; }
  #lap-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

  .lap-row{
    display:flex;
    justify-content:space-between;
    font-size:0.95rem;
    color:var(--text);
    background:rgba(255,255,255,0.02);
    padding:8px 14px;
    border-radius:8px;
  }
  .lap-row span:first-child{ color:var(--muted); }
  .lap-row span:last-child{ font-family:'Orbitron',sans-serif; }

  .empty-laps{
    color:var(--muted);
    font-size:0.9rem;
    padding:10px 0;
  }
</style>
</head>
<body>

  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="stripes"></div>
    <h1>SPRINT<span>TIMER</span></h1>
    <p class="subtitle">Train. Track. Beat your time.</p>
    <div style="position:relative; display:flex; align-items:center; justify-content:center;">
      <div class="pulse-ring"></div>
      <button class="start-btn" onclick="goToTimer()">START</button>
    </div>
  </div>

  <!-- TIMER SCREEN -->
  <div id="timer-screen" class="screen">
    <div class="stripes"></div>
    <div class="top-bar">
      <div class="brand">SPRINT<span>TIMER</span></div>
      <button class="back-btn" onclick="goToStart()">← Back</button>
    </div>

    <div class="clock-wrap">
      <div class="clock-label">Current Time</div>
      <div id="live-clock">--:--:--</div>
    </div>

    <div class="panel">
      <div class="stopwatch-label">Stopwatch</div>
      <div id="stopwatch">00:00<span class="ms">.00</span></div>

      <div class="controls">
        <button class="ctrl-btn btn-primary" id="toggle-btn" onclick="toggleStopwatch()">Start</button>
        <button class="ctrl-btn btn-secondary" onclick="addLap()">Lap / Count</button>
        <button class="ctrl-btn btn-reset" onclick="resetStopwatch()">Reset</button>
      </div>

      <div class="lap-section">
        <div class="lap-header">
          <div class="lap-title">Laps</div>
          <div class="lap-count" id="lap-count">0</div>
        </div>
        <div id="lap-list">
          <div class="empty-laps" id="empty-laps">No laps yet — hit "Lap / Count" while the clock is running.</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------- Screen navigation ----------
  function goToTimer(){
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('timer-screen').classList.add('active');
  }
  function goToStart(){
    document.getElementById('timer-screen').classList.remove('active');
    document.getElementById('start-screen').classList.add('active');
  }

  // ---------- Live clock ----------
  function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ---------- Stopwatch ----------
  let swInterval = null;
  let swStart = 0;
  let swElapsed = 0;
  let running = false;
  let lapCount = 0;

  const stopwatchEl = document.getElementById('stopwatch');
  const toggleBtn = document.getElementById('toggle-btn');
  const lapListEl = document.getElementById('lap-list');
  const lapCountEl = document.getElementById('lap-count');
  const emptyLapsEl = document.getElementById('empty-laps');

  function formatTime(ms){
    const totalCentis = Math.floor(ms/10);
    const minutes = Math.floor(totalCentis / 6000);
    const seconds = Math.floor((totalCentis % 6000) / 100);
    const centis = totalCentis % 100;
    return {
      main: `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`,
      ms: String(centis).padStart(2,'0')
    };
  }

  function renderStopwatch(){
    const elapsed = running ? (swElapsed + (Date.now() - swStart)) : swElapsed;
    const t = formatTime(elapsed);
    stopwatchEl.innerHTML = `${t.main}<span class="ms">.${t.ms}</span>`;
  }

  function toggleStopwatch(){
    if(!running){
      running = true;
      swStart = Date.now();
      swInterval = setInterval(renderStopwatch, 30);
      toggleBtn.textContent = 'Pause';
    } else {
      running = false;
      swElapsed += Date.now() - swStart;
      clearInterval(swInterval);
      toggleBtn.textContent = 'Resume';
      renderStopwatch();
    }
  }

  function resetStopwatch(){
    running = false;
    clearInterval(swInterval);
    swElapsed = 0;
    swStart = 0;
    lapCount = 0;
    lapCountEl.textContent = '0';
    lapListEl.innerHTML = '';
    lapListEl.appendChild(emptyLapsEl);
    toggleBtn.textContent = 'Start';
    renderStopwatch();
  }

  function addLap(){
    const elapsed = running ? (swElapsed + (Date.now() - swStart)) : swElapsed;
    lapCount++;
    lapCountEl.textContent = lapCount;
    if(emptyLapsEl.parentNode === lapListEl){
      lapListEl.removeChild(emptyLapsEl);
    }
    const t = formatTime(elapsed);
    const row = document.createElement('div');
    row.className = 'lap-row';
    row.innerHTML = `<span>Lap ${lapCount}</span><span>${t.main}.${t.ms}</span>`;
    lapListEl.insertBefore(row, lapListEl.firstChild);
  }

  renderStopwatch();
</script>
</body>
</html>
